name: Enhancement
description: An idea for making the port better.
title: "[IDEA] "
body:
  - type: textarea
    id: idea
    attributes:
      label: What's the idea?
      description: Keep it to one feature/improvement per issue.
    validations:
      required: true
  - type: textarea
    id: ps1
    attributes:
      label: Why does it make sense for the PS1 port?
      description: Hardware limits, parity, controls, performance, quality-of-life, etc.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Mockups, references, implementation ideas, whatever helps.
